[build-system]
requires = ["setuptools>=65.0"]
build-backend = "setuptools.build_meta"

[project]
name = "fraud-base-rate-calibrator"
version = "1.0.0"
description = "Offline fraud alert threshold calibrator exposing base-rate false positives"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [
    {name = "Sai Hanwith Bellamkonda", email = "saihanwith.b@mycvcareer.com"}
]
dependencies = []

[project.scripts]
fraud-calibrator = "fraud_base_rate_calibrator.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "W"]
