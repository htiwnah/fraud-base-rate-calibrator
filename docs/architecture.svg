<svg xmlns="http://www.w3.org/2000/svg" width="1140" height="330" viewBox="0 0 1140 330">
  <rect width="1140" height="330" rx="12" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="32" y="34" fill="#0f172a" font-family="sans-serif" font-size="16" font-weight="bold">fraud-base-rate-calibrator Pipeline Architecture (Offline &amp; Deterministic)</text>
  <rect x="28" y="56" width="256" height="236" rx="10" fill="#ffffff" stroke="#64748b" stroke-width="1.5"/>
  <text x="46" y="90" fill="#0f172a" font-family="sans-serif" font-size="16" font-weight="bold">1. Scored Tx JSONL</text>
  <text x="46" y="122" fill="#334155" font-family="monospace" font-size="13">50 transactions, 5 channels</text>
  <text x="46" y="148" fill="#334155" font-family="monospace" font-size="13">Risk scores & fraud labels</text>
  <text x="46" y="174" fill="#334155" font-family="monospace" font-size="13">8.0% fraud base rate</text>
  <line x1="284" y1="174" x2="330" y2="174" stroke="#0284c7" stroke-width="2.5"/>
  <polygon points="330,168 342,174 330,180" fill="#0284c7"/>
  <rect x="342" y="56" width="368" height="236" rx="10" fill="#eff6ff" stroke="#0284c7" stroke-width="1.5"/>
  <text x="360" y="90" fill="#0f172a" font-family="sans-serif" font-size="16" font-weight="bold">2. Base-Rate Calibrator</text>
  <text x="360" y="122" fill="#1e293b" font-family="monospace" font-size="13">Exact pairwise ROC-AUC</text>
  <text x="360" y="148" fill="#1e293b" font-family="monospace" font-size="13">TP / FP / FN / TN counts</text>
  <text x="360" y="174" fill="#1e293b" font-family="monospace" font-size="13">Precision, recall & F1</text>
  <line x1="710" y1="174" x2="756" y2="174" stroke="#15803d" stroke-width="2.5"/>
